# Isolated direct-SIP control service; no existing application is replaced.
app = "stellar-carol-sip-staging"
primary_region = "lax"
[build]
  dockerfile = "Dockerfile.carol-sip"
[env]
  NODE_ENV = "production"
  PORT = "8080"
  STELLAR_BRIDGE_STAGING = "true"
  PMA_ENVIRONMENT = "staging"
  PMA_SIP_ENABLED = "false"
  PMA_STAGING_BASE_URL = "https://pma-validation--ai4cc-staging.netlify.app"
  OPENAI_REALTIME_SIP_MODEL = "gpt-realtime-2.1"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1
  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
