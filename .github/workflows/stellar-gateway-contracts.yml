name: Stellar staging gateway contracts

on:
  pull_request:
    branches: [main, repair/restore-approved-support-20261017]
    paths:
      - 'pages/api/staging-orchestration/**'
      - 'pages/experimental-staging-orchestration-test.tsx'
      - 'twilio-bridge/tests/staging-runner/*gateway*'
      - 'twilio-bridge/tests/staging-runner/support-orchestration-integration.staging.cjs'
      - '.github/workflows/stellar-gateway-contracts.yml'

permissions:
  contents: read

jobs:
  contracts:
    if: github.event.pull_request.head.repo.full_name == 'Aproposchpt2/ai4-contact-center' && github.event.pull_request.head.ref == 'feature/staging-orchestrator-trigger-gateway'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # No secrets, package installation, database connection or deployment.
      - name: Gateway, Node HTTP adapter and browser harness contracts
        run: >-
          node --test
          twilio-bridge/tests/staging-runner/authenticated-support-gateway.staging.test.cjs
          twilio-bridge/tests/staging-runner/staging-gateway-node-adapter.test.cjs
          twilio-bridge/tests/staging-runner/gateway-browser-acceptance.staging.test.cjs
