name: PMA Availability Independent Review
on:
  push:
    branches: ['repair/pma-005-availability-incident-20261023']
  pull_request:
    branches: ['repair/pma-003-agent05-qa-20261023']
permissions:
  contents: read
jobs:
  regression-and-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --test twilio-bridge/tests/*.test.cjs
      - run: npx tsc --noEmit
      - name: Build local staging image and verify immutable revision
        run: |
          source_sha=$(git rev-parse HEAD)
          docker build -f twilio-bridge/Dockerfile.pma-staging --build-arg "PMA_SOURCE_SHA=$source_sha" -t pma-availability-review twilio-bridge
          test "$(docker image inspect pma-availability-review --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$source_sha"
          docker run --rm --entrypoint node pma-availability-review -e "if(process.env.BRIDGE_RELEASE_SHA!==process.argv[1])process.exit(1); require('./pma-adapter.cjs')" "$source_sha"
      - name: Reject a staging image without source provenance
        run: |
          if docker build -f twilio-bridge/Dockerfile.pma-staging -t pma-missing-revision twilio-bridge; then
            echo 'Missing source revision was incorrectly accepted'
            exit 1
          fi
