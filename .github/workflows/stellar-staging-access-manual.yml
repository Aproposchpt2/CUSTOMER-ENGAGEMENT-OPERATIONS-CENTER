name: Stellar staging access (manual only)

on:
  workflow_dispatch:
    inputs:
      acceptance:
        description: 'Execute authorized C1/R1 synthetic fixtures, restart tests, and cleanup'
        type: boolean
        required: true
        default: false

      dispatcher:
        description: 'Execute authorized D01-D11 committed dispatcher acceptance and cleanup'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: stellar-staging-access
  cancel-in-progress: false

jobs:
  read-only-access:
    if: github.repository == 'Aproposchpt2/ai4-contact-center' && github.ref == 'refs/heads/feature/staging-orchestrator-trigger-gateway'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Owner must configure this protected environment before any credentialed run.
    # No repository-wide credentials or deployment steps. Fixtures require explicit acceptance input.
    environment: stellar-staging-access
    defaults:
      run:
        working-directory: twilio-bridge/tests/staging-runner
    steps:
      - uses: actions/checkout@v4
        with:
          # Reviewed staging test revision; do not execute arbitrary branch contents with secrets.
          ref: 1ffa50c0adb7d198576054c7c3fb0ad6098fcbe0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned test dependencies without secrets
        run: npm ci --ignore-scripts --no-fund
      - name: Run guard tests without secrets
        run: npm test
      - name: Validate acceptance evidence guards without secrets
        run: node --test c1-r1-acceptance.test.cjs
      - name: Validate dispatcher and acceptance safety guards without secrets
        run: node --test dispatcher.staging.test.cjs dispatcher-database.staging.test.cjs dispatcher-acceptance.test.cjs
      - name: Independent PostgreSQL client check (read only)
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_DATABASE_CA_PEM: ${{ secrets.STAGING_DATABASE_CA_PEM }}
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee psql-evidence.json
          import json, os, re, shutil, subprocess, sys, tempfile
          from urllib.parse import urlsplit, unquote
          from pathlib import Path
          
          def check():
              if not shutil.which("psql"):
                  return {"status": "BLOCKED", "code": "PSQL_CLIENT_UNAVAILABLE"}
              try:
                  u = urlsplit(os.environ["STAGING_DATABASE_URL"])
                  valid = (u.scheme in ("postgres", "postgresql")
                           and u.hostname == "aws-0-us-west-1.pooler.supabase.com"
                           and u.port == 5432 and u.path == "/postgres"
                           and not u.query and not u.fragment
                           and unquote(u.username or "") == "postgres.hvzauakkhlivzeqatfqm"
                           and bool(u.password))
                  if not valid:
                      return {"status": "BLOCKED", "code": "PSQL_TARGET_REJECTED"}
                  ca = os.environ.get("STAGING_DATABASE_CA_PEM", "")
                  if "-----BEGIN CERTIFICATE-----" not in ca:
                      return {"status": "BLOCKED", "code": "PSQL_CA_REQUIRED"}
                  with tempfile.TemporaryDirectory() as directory:
                      root = Path(directory) / "root.crt"
                      root.write_text(ca)
                      root.chmod(0o600)
                      env = {k: os.environ[k] for k in ("PATH", "LANG") if k in os.environ}
                      env.update(PGHOST=u.hostname, PGPORT="5432", PGDATABASE="postgres",
                                 PGUSER=unquote(u.username), PGPASSWORD=unquote(u.password),
                                 PGSSLMODE="verify-full", PGSSLROOTCERT=str(root), PGGSSENCMODE="disable",
                                 PGCONNECT_TIMEOUT="8", PGAPPNAME="stellar-readonly-independent-client",
                                 PGOPTIONS="-c default_transaction_read_only=on -c statement_timeout=8000")
                      sql = """BEGIN READ ONLY;
                      SELECT json_build_object('status','DATABASE_CLIENT_CONNECTED',
                        'backendPid',pg_backend_pid(),'readOnly',current_setting('transaction_read_only'),
                        'databaseBackendTls',(SELECT ssl FROM pg_stat_ssl WHERE pid=pg_backend_pid()));
                      ROLLBACK;"""
                      result = subprocess.run(["psql", "-X", "-w", "-A", "-t", "-q",
                                   "-v", "ON_ERROR_STOP=1", "-v", "VERBOSITY=sqlstate", "-c", "\\conninfo", "-c", sql],
                                  env=env, capture_output=True, text=True, timeout=15)
                      if result.returncode:
                          auth = "28P01" in result.stderr or "password authentication failed" in result.stderr.lower()
                          return {"status": "BLOCKED", "code": "PSQL_AUTHENTICATION_REJECTED" if auth else "PSQL_CONNECTION_REJECTED"}
                      lines = result.stdout.strip().splitlines()
                      evidence = json.loads(lines[-1])
                      client_tls = any("SSL connection" in line for line in lines)
                      if (evidence.get("status") != "DATABASE_CLIENT_CONNECTED"
                          or evidence.get("readOnly") != "on" or not client_tls):
                          return {"status": "BLOCKED", "code": "PSQL_READONLY_TLS_NOT_VERIFIED"}
                      return {**evidence, "clientTlsVerified": True, "clientTlsMode": "verify-full", "acceptanceExecuted": False}
              except subprocess.TimeoutExpired:
                  return {"status": "BLOCKED", "code": "PSQL_TIMEOUT"}
              except Exception:
                  return {"status": "BLOCKED", "code": "PSQL_CONFIGURATION_REJECTED"}
          
          evidence = check()
          print(json.dumps(evidence))
          sys.exit(0 if evidence["status"] == "DATABASE_CLIENT_CONNECTED" else 2)
          PY
      - name: Check staging access (no fixtures)
        env:
          STELLAR_BRIDGE_STAGING: 'true'
          CSS_TENANT_ID: 5885a020-d363-4c27-910a-c035eda132f5
          SUPABASE_URL: https://hvzauakkhlivzeqatfqm.supabase.co
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_DATABASE_CA_PEM: ${{ secrets.STAGING_DATABASE_CA_PEM }}
        # Keep the reviewed runner's staging-only validation and pinned code unchanged.
        run: |
          set -euo pipefail
          STAGING_SUPABASE_URL="$SUPABASE_URL" \
          STAGING_SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY" \
          node access-check.cjs | tee access-evidence.json
      - name: C1 concurrency and R1 committed worker restart
        if: inputs.acceptance == true
        env:
          STAGING_ACCEPTANCE_AUTHORIZED: C1_R1
          STELLAR_BRIDGE_STAGING: 'true'
          CSS_TENANT_ID: 5885a020-d363-4c27-910a-c035eda132f5
          STAGING_SUPABASE_URL: https://hvzauakkhlivzeqatfqm.supabase.co
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_DATABASE_CA_PEM: ${{ secrets.STAGING_DATABASE_CA_PEM }}
        run: node c1-r1-acceptance.cjs
      - name: D01-D11 committed dispatcher acceptance
        if: inputs.dispatcher == true
        env:
          STAGING_DISPATCH_ACCEPTANCE_AUTHORIZED: D01_D11
          STELLAR_BRIDGE_STAGING: 'true'
          CSS_TENANT_ID: 5885a020-d363-4c27-910a-c035eda132f5
          STAGING_SUPABASE_URL: https://hvzauakkhlivzeqatfqm.supabase.co
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_DATABASE_CA_PEM: ${{ secrets.STAGING_DATABASE_CA_PEM }}
        run: node dispatcher-acceptance.cjs
      - name: Retain only redacted access evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stellar-staging-access-evidence
          path: |
            twilio-bridge/tests/staging-runner/access-evidence.json
            twilio-bridge/tests/staging-runner/psql-evidence.json
            twilio-bridge/tests/staging-runner/c1-r1-evidence.json
            twilio-bridge/tests/staging-runner/dispatcher-evidence.json
          if-no-files-found: ignore
          retention-days: 7
