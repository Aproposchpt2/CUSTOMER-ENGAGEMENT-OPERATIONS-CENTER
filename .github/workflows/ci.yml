name: CI

on:
  push:
    branches: [main, repair/voice-transaction-reliability-20261017]
  pull_request:
    branches: [main, experiment/gpt-live-voice-poc]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm test
