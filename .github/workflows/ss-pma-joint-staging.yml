name: Joint PMA Sales Support Staging Validation
on:
  push:
    branches:
      - integration/ss-pma-joint-20261025
  pull_request:
    branches:
      - pma-validation
  workflow_dispatch:
jobs:
  joint-staging-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify bridge syntax
        run: |
          node --check twilio-bridge/server.js
          node --check twilio-bridge/specialist-staging.cjs
          node --check twilio-bridge/pma-adapter.cjs
      - name: Run specialist and shared bridge tests
        run: node --test tests/specialistStaging.test.mts tests/voiceBridgeRuntime.test.mts tests/voiceBridgeSafety.test.mts
      - name: Run PMA emergency tool regression
        run: node --test twilio-bridge/tests/pma-emergency-tool-invocation.test.cjs
      - name: Verify Fly PMA image dependency closure
        run: node --test tests/pmaFlyJointImageDependencies.test.mts
      - name: Run complete application test suite
        id: full_suite
        continue-on-error: true
        run: npm test
      - name: Install isolated PostgreSQL test dependencies
        if: always()
        run: npm ci --prefix tests/ss-staging-002 --ignore-scripts
      - name: Run isolated PostgreSQL persistence regression
        if: always()
        run: node tests/ss-staging-002/postgres.mjs
      - name: Verify optimized build and types
        if: always()
        run: npm run build
      - name: Enforce complete-suite gate
        if: always() && steps.full_suite.outcome == 'failure'
        run: |
          echo 'Complete application suite failed; review inherited and newly introduced failures.'
          exit 1
