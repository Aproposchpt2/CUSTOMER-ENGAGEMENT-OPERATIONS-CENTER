name: Staging Orchestrator Gateway Contract Tests
on:
  pull_request:
    paths:
      - 'twilio-bridge/orchestrator-gateway.staging.cjs'
      - 'twilio-bridge/orchestrator-durable.staging.cjs'
      - 'twilio-bridge/orchestrator-voice-adapter.staging.cjs'
      - 'twilio-bridge/voice-orchestrator-adapter.staging.test.cjs'
      - 'twilio-bridge/server.js'
      - 'twilio-bridge/Dockerfile'
      - 'twilio-bridge/tests/orchestrator-durable.staging.test.cjs'
      - 'twilio-bridge/tests/staging-reconcile-worker.cjs'
      - 'twilio-bridge/tests/staging-reconcile-worker.test.cjs'
      - 'twilio-bridge/tests/orchestrator-gateway.staging.test.cjs'
      - 'twilio-bridge/tests/staging-runner/**'
      - '.github/workflows/staging-orchestrator-gateway.yml'
  workflow_dispatch:
jobs:
  gateway-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test twilio-bridge/tests/orchestrator-gateway.staging.test.cjs twilio-bridge/tests/orchestrator-durable.staging.test.cjs twilio-bridge/tests/staging-reconcile-worker.test.cjs twilio-bridge/tests/staging-runner/access-check.test.cjs twilio-bridge/voice-orchestrator-adapter.staging.test.cjs
