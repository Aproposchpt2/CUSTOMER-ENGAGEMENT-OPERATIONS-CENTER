name: Experimental Voice POC Validation
on:
  push:
    branches:
      - experiment/gpt-live-voice-poc
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Automated tests
        run: npm test
      - name: Next.js production build
        run: npm run build
